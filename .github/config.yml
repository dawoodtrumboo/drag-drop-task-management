# .github/config.yml
# Configure PR templates based on branch naming patterns

# Enable the template match feature
templateMatcher:
  enabled: true

# Define different templates for different branch patterns
templates:
  # Only apply template for hotfix branches
  - template: .github/pull_request_template.md
    branches:
      - '/^hotfix\/.*$/'
      
  # Empty template for all other branches
  - template: .github/empty_template.md
    branches:
      - '*'